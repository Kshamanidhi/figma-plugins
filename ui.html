<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      padding: 14px;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Font card */
    .font-card {
      background: #e9ecef;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .font-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .font-family {
      font-size: 16px;
      font-weight: 500;
      color: #111;
    }

    .font-style {
      font-size: 13px;
      color: #555;
    }

    .copy-btn {
      cursor: pointer;
      opacity: 0.6;
    }

    .copy-btn:hover {
      opacity: 1;
    }

    /* Controls */
    .control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #333;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    textarea {
      width: 100%;
      min-height: 60px;
      padding: 10px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid #d0d0d0;
      resize: none;
      font-family: inherit;
    }

    .spacer {
      flex: 1;
    }

    /* CTA */
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 500;
      border-radius: 12px;
      border: none;
      background: #3f6fe5;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #355fd1;
    }

    /* Hidden copy input */
    #copyInput {
      position: absolute;
      left: -9999px;
      opacity: 0;
    }
  </style>
</head>

  <!-- Font display card -->
  <div class="font-card">
    <div class="font-info">
      <div class="font-family" id="fontFamily">Font Name</div>
      <div class="font-style" id="fontStyle">Font Weight</div>
    </div>

    <!-- Copy icon (simple) -->
    <div class="copy-btn" id="copyBtn">
      📋
    </div>
  </div>

  <!-- Controls -->
  <label class="control">
    <input type="checkbox" id="excludeCommon" />
    Exclude common fonts
  </label>

  <textarea
    id="excludeList"
    placeholder="Inter, Roboto, Poppins"
    style="display:none;"
  ></textarea>

  <label class="control">
    <input type="checkbox" id="lockStyle" />
    Lock font style
  </label>

  <div class="spacer"></div>

  <!-- CTA -->
  <button id="randomBtn">Randomise Font</button>

  <!-- Hidden input for safe copy -->
  <input type="text" id="copyInput" />

  <script>
    var excludeCheckbox = document.getElementById("excludeCommon");
    var excludeTextarea = document.getElementById("excludeList");
    var fontFamilyEl = document.getElementById("fontFamily");
    var fontStyleEl = document.getElementById("fontStyle");

    excludeCheckbox.onchange = function () {
  var expanded = excludeCheckbox.checked;

  excludeTextarea.style.display = expanded ? "block" : "none";

  parent.postMessage({
    pluginMessage: {
      type: "RESIZE_UI",
      expanded: expanded
    }
  }, "*");
};


    document.getElementById("randomBtn").onclick = function () {
      parent.postMessage({
        pluginMessage: {
          type: "RANDOM_FONT",
          excludeCommon: excludeCheckbox.checked,
          excludeList: excludeTextarea.value,
          lockStyle: document.getElementById("lockStyle").checked
        }
      }, "*");
    };

    document.getElementById("copyBtn").onclick = function () {
      var text = fontFamilyEl.innerText + " – " + fontStyleEl.innerText;
      var input = document.getElementById("copyInput");
      input.value = text;
      input.select();
      document.execCommand("copy");
    };

    onmessage = function (event) {
      if (
        event.data &&
        event.data.pluginMessage &&
        event.data.pluginMessage.fontName
      ) {
        var parts = event.data.pluginMessage.fontName.split(" – ");
        fontFamilyEl.innerText = parts[0] || "—";
        fontStyleEl.innerText = parts[1] || "";
      }
    };
  </script>

</body>
</html>
